<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0f0f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Apple iOS PWA Support -->
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DebtFlow Pro" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="msapplication-TileColor" content="#0f766e" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />
    <title>DebtFlow Pro - نظام إدارة الديون والفواتير</title>
    <meta name="description" content="نظام احترافي لإدارة الديون والفواتير للشركات الليبية - إدارة العملاء والمصروفات والمدفوعات" />
    <meta name="keywords" content="إدارة ديون, فواتير, مصروفات, مدفوعات, ليبيا" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* Splash screen for PWA */
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #0c0f0f 0%, #141818 50%, #0f1412 100%);
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }
      #splash-screen img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        animation: splash-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        filter: drop-shadow(0 8px 32px rgba(45, 212, 191, 0.25));
      }
      #splash-screen .splash-title {
        margin-top: 20px;
        font-family: 'Outfit', 'Cairo', sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #f5f5f4;
        letter-spacing: -0.02em;
      }
      #splash-screen .splash-sub {
        margin-top: 6px;
        font-family: 'Cairo', sans-serif;
        font-size: 13px;
        color: rgba(168, 162, 158, 0.7);
        font-weight: 500;
      }
      #splash-screen .splash-loader {
        margin-top: 32px;
        width: 40px;
        height: 3px;
        background: rgba(45, 212, 191, 0.15);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }
      #splash-screen .splash-loader::after {
        content: '';
        position: absolute;
        top: 0;
        left: -40px;
        width: 40px;
        height: 100%;
        background: linear-gradient(90deg, transparent, #2dd4bf, transparent);
        animation: splash-slide 1.2s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes splash-slide {
        0% { left: -40px; }
        100% { left: 40px; }
      }
    </style>
  </head>
  <body>
    <!-- PWA Splash Screen -->
    <div id="splash-screen">
      <img src="/logo.png" alt="DebtFlow Pro" />
      <div class="splash-title">DebtFlow Pro</div>
      <div class="splash-sub">نظام إدارة الديون والفواتير</div>
      <div class="splash-loader"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash screen once app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash-screen');
          if (splash) splash.classList.add('hidden');
          setTimeout(function() { if (splash) splash.remove(); }, 500);
        }, 800);
      });
    </script>
  </body>
</html>
